# logcanary lab. Memory limits add up to 3,008 MB; keep the total under 3.5 GB.
# SHIPPER_SET=default|tuned picks lab/shippers/<set>/.
name: logcanary
networks:
  lcnet:
    name: lcnet
volumes:
  es-data:
  hostlog:
  fbstate:
services:
  es:
    image: elasticsearch:8.19.25@sha256:ef44866274bd7cb2c644f4f6657ce0832819f662adb66b2769d0ba5dabad77d6
    container_name: lc-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
    mem_limit: 2048m
    volumes: [es-data:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:9200:9200"]
    networks: [lcnet]
  host:
    # built by `make lab` (docker build --network host lab/host)
    image: logcanary-host:noble
    container_name: lc-host
    init: true
    hostname: lab-host
    mem_limit: 256m
    volumes:
      - hostlog:/var/log
      - ../src:/opt/logcanary/src:ro
    networks: [lcnet]
  filebeat:
    image: elastic/filebeat:8.19.25@sha256:3431da8fc454833065bbf3bffc9e7c180640fdb9703744aad947edee29672257
    container_name: lc-filebeat
    hostname: lab-host  # as if installed on the host
    user: root
    command: ["filebeat", "-e", "--strict.perms=false", "-c", "/etc/lc/filebeat.yml"]
    mem_limit: 256m
    volumes:
      - hostlog:/var/log:ro
      - ./shippers/${SHIPPER_SET:-default}/filebeat.yml:/etc/lc/filebeat.yml:ro
    ports: ["127.0.0.1:5066:5066"]
    networks: [lcnet]
    depends_on: [es, host]
  fluentbit:
    image: fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    container_name: lc-fluentbit
    hostname: lab-host  # as if installed on the host
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/etc/lc/fluent-bit.conf"]
    mem_limit: 192m
    volumes:
      - hostlog:/var/log:ro
      - fbstate:/fluent-bit/state
      - ./shippers/${SHIPPER_SET:-default}/fluent-bit.conf:/etc/lc/fluent-bit.conf:ro
    ports: ["127.0.0.1:2020:2020"]
    networks: [lcnet]
    depends_on: [es, host]
  vector:
    image: timberio/vector:0.61.0-debian@sha256:f6c23b5a7e16fb2838d33619ef7acf4bad2289a7cf22bc90efc2371f520c4ea2
    container_name: lc-vector
    hostname: lab-host  # as if installed on the host
    command: ["--config", "/etc/lc/vector.yaml"]
    mem_limit: 256m
    volumes:
      - hostlog:/var/log:ro
      - ./shippers/${SHIPPER_SET:-default}/vector.yaml:/etc/lc/vector.yaml:ro
    ports: ["127.0.0.1:9598:9598"]
    networks: [lcnet]
    depends_on: [es, host]
