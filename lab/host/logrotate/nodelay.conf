# Aggressive rotation under disk pressure: keep one rotated file and compress it at once
# (no delaycompress), so the rotated plain file is deleted straight away.
# su (and create) from Ubuntu's global /etc/logrotate.conf
su root syslog
create
/var/log/syslog
{
	rotate 1
	missingok
	compress
	sharedscripts
	postrotate
		/usr/local/bin/lc-daemon hup rsyslog
	endscript
}
