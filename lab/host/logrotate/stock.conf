# Ubuntu 24.04 /etc/logrotate.d/rsyslog options for /var/log/syslog, with the postrotate
# changed from systemctl to a direct HUP because the lab host has no systemd PID 1.
# su (and create) from Ubuntu's global /etc/logrotate.conf
su root syslog
create
/var/log/syslog
{
	rotate 4
	daily
	missingok
	notifempty
	compress
	delaycompress
	sharedscripts
	postrotate
		/usr/local/bin/lc-daemon hup rsyslog
	endscript
}
