# copytruncate: the file is copied and then truncated in place, a common setting for apps that
# cannot reopen their log. Lines written between the copy and the truncate are lost by design.
# su from Ubuntu's global /etc/logrotate.conf
su root syslog
/var/log/syslog
{
	rotate 4
	missingok
	copytruncate
	compress
	delaycompress
}
