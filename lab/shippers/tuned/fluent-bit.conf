# Fluent Bit 5.1.5, tuned set: the reliability settings from the Fluent Bit docs.
# Offset DBs on both inputs, filesystem buffering, unlimited retries.
[SERVICE]
    Flush                     1
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /fluent-bit/state/buffer
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name           tail
    Tag            file.syslog
    Path           /var/log/syslog
    DB             /fluent-bit/state/tail.db
    storage.type   filesystem
    Mem_Buf_Limit  32MB

[INPUT]
    Name          systemd
    Tag           journal
    Path          /var/log/journal
    DB            /fluent-bit/state/systemd.db
    storage.type  filesystem

[OUTPUT]
    Name                es
    Match               *
    Host                es
    Port                9200
    Index               lc-fluentbit
    Suppress_Type_Name  On
    Retry_Limit         False
