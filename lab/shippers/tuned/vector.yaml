# Vector 0.61.0, tuned set: end-to-end acknowledgements (checkpoints wait for Elasticsearch) and a
# disk buffer in front of the sink.
data_dir: /var/lib/vector
sources:
  syslog_file:
    type: file
    include: [/var/log/syslog]
  journal:
    type: journald
    journal_directory: /var/log/journal
  self_metrics:
    type: internal_metrics
sinks:
  es:
    type: elasticsearch
    inputs: [syslog_file, journal]
    endpoints: ["http://es:9200"]
    api_version: v8
    mode: bulk
    bulk:
      index: lc-vector
    acknowledgements:
      enabled: true
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  metrics:
    type: prometheus_exporter
    inputs: [self_metrics]
    address: 0.0.0.0:9598
