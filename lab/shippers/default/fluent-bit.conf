# Fluent Bit 5.1.5, default behaviour: the tail and systemd examples from the Fluent Bit docs and
# the es output. No offset DB, Retry_Limit and buffering are the shipped defaults.
# One deviation: Read_From_Tail On for systemd (as in the official Helm chart); without a DB the
# default would re-ship the whole journal on every restart.
[SERVICE]
    Flush        1
    Log_Level    info
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name   tail
    Tag    file.syslog
    Path   /var/log/syslog

[INPUT]
    Name            systemd
    Tag             journal
    Path            /var/log/journal
    Read_From_Tail  On

[OUTPUT]
    Name                es
    Match               *
    Host                es
    Port                9200
    Index               lc-fluentbit
    Suppress_Type_Name  On
